name: Quantum Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Setup Python ecosystem
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'
        cache: 'pip'

    # Dependencies for Quantum Sustainability stack
    - name: Install Quantum & Data Libraries
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy scipy pandas matplotlib
        pip install qiskit qiskit-aer pennylane

    # Executes tests automatically to keep asynchronous handoffs safe
    - name: Run Modular Tests
      run: |
        pytest tests/
